<div class="relative max-w-md">
  <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
    <app-icons [name]="Icon" class="h-4 w-4"></app-icons>
  </div>
  <input
    [id]="Id"
    type="text"
    [formControl]="control"
    class="block w-full rounded-xl border border-secondary bg-secondary/20 py-2 pl-10 pr-4 text-sm transition focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary"
    mwlFlatpickr
    [placeholder]="Placeholder"
    [altInput]="true"
    [altFormat]="altFormatComputed"
    [convertModelValue]="false"
    [enableTime]="Tempo"
    [locale]="localePt"
    [time24hr]="true"
    [dateFormat]="DateFormat"
  />
</div>
