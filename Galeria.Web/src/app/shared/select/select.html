<div class="relative max-w-svw">
  <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
    <app-icons [name]="Icon" class="h-4 w-4"></app-icons>
  </div>
  <select
    [id]="Id"
    class="w-full block rounded-xl border bg-transparent border-neutral-300 py-2 pl-10 pr-4 text-sm focus:outline-none focus:ring-2 focus:ring-gray-400 focus:border-transparent transition"
    [formControl]="control"
  >
    <option [ngValue]="null" disabled>{{ Placeholder }}</option>
    @for (option of Options; track $index) {
      <option [ngValue]="option.value">{{ option.label }}</option>
    }
  </select>
</div>
