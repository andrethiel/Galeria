<div class="relative">
  <div class="absolute start-0 top-3 flex items-start ps-3 pointer-events-none">
    <app-icons [name]="Icon" class="h-5 w-5"></app-icons>
  </div>
  <textarea
    [id]="Id"
    class="w-full rounded-lg border border-secondary bg-secondary/20 px-10 py-3 transition focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary"
    [placeholder]="Placeholder"
    [formControl]="control"
    [rows]="Rows"
  ></textarea>
</div>
