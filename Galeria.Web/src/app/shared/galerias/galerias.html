<article class="group relative min-w-0 text-inherit">
  <div
    class="relative h-36 overflow-hidden rounded bg-cover bg-center shadow-sm transition group-hover:-translate-y-0.5 group-hover:shadow-lg sm:h-48"
    [style.background-image]="'url(' + galerias.image + ')'"
  >
    <span
      class="absolute inset-0 bg-gradient-to-b from-black/10 via-transparent to-black/35"
    ></span>

    <span class="absolute right-3 top-2 text-sm font-medium text-white drop-shadow">
      {{ galerias.totalImagens }} imagens
    </span>

    @if (galerias.status === 2) {
      <span
        class="absolute left-3 top-2 grid size-8 place-items-center rounded-full bg-white/95 text-green-600 shadow-sm"
        title="Galeria publicada"
        aria-label="Galeria publicada"
      >
        <app-icons name="badge-check" class="size-5" />
      </span>
    }

    <div
      class="pointer-events-none absolute inset-0 flex items-center justify-center opacity-0 transition-opacity group-hover:opacity-100"
    >
      <a
        href=""
        (click)="abrirEdicao($event)"
        [attr.aria-label]="'Abrir ' + galerias.nome"
        class="pointer-events-auto grid size-12 place-items-center text-white"
      >
        <app-icons name="external-link" class="size-8" />
      </a>
    </div>

    <div
      class="absolute bottom-2 right-2 flex items-center gap-2 opacity-0 transition-opacity group-hover:opacity-100"
    >
      <button
        type="button"
        aria-label="Editar galeria"
        (click)="abrirEdicao($event)"
        class="grid size-8 place-items-center rounded-full text-white drop-shadow hover:bg-white/20"
      >
        <app-icons name="pencil" class="size-5" />
      </button>
      <button
        type="button"
        (click)="deleteGaleria()"
        class="grid size-9 place-items-center rounded-full text-white drop-shadow hover:bg-white/20"
      >
        <app-icons name="trash-2" class="size-5" />
      </button>
    </div>
  </div>
  <div class="pt-2">
    <span class="block truncate text-base font-normal tracking-[-0.02em] no-underline">
      {{ galerias.nome }}
    </span>
  </div>
</article>
