<header
  class="fixed inset-x-0 bottom-0 z-50 border-t border-secondary bg-white/95 pb-[env(safe-area-inset-bottom)] shadow-[0_-4px_16px_rgba(73,51,30,0.08)] backdrop-blur"
>
  <div
    class="mx-auto flex w-full max-w-screen-2xl items-stretch justify-center gap-2 px-4 py-2 sm:px-6 lg:px-8"
  >
    <a
      routerLink="/"
      routerLinkActive="bg-secondary font-medium"
      [routerLinkActiveOptions]="{ exact: true }"
      aria-label="Início"
      class="flex min-w-24 flex-1 flex-col items-center justify-center gap-1 rounded-lg px-3 py-1.5 text-xs text-primary transition-colors hover:bg-secondary sm:max-w-40"
    >
      <app-icons name="home" class="size-5" />
      <span>Início</span>
    </a>
    <a
      routerLink="/agenda"
      routerLinkActive="bg-secondary font-medium"
      [routerLinkActiveOptions]="{ exact: true }"
      aria-label="Agenda"
      class="flex min-w-24 flex-1 flex-col items-center justify-center gap-1 rounded-lg px-3 py-1.5 text-xs text-primary transition-colors hover:bg-secondary sm:max-w-40"
    >
      <app-icons name="calendar-days" class="size-5" />
      <span>Agenda</span>
    </a>
    <button
      type="button"
      aria-label="Configurações da galeria"
      (click)="openGallerySettings($event)"
      class="flex min-w-24 flex-1 flex-col items-center justify-center gap-1 rounded-lg px-3 py-1.5 text-xs text-primary transition-colors hover:bg-secondary sm:max-w-40"
    >
      <app-icons name="settings-2" class="size-5" />
      <span>Configurações</span>
    </button>
  </div>
</header>
