<section
  class="mx-auto w-[calc(100%-2rem)] max-w-7xl py-11 pb-16 text-neutral-900 sm:w-[calc(100%-3rem)] lg:px-0"
>
  <div
    class="mb-6 grid grid-cols-[1fr_auto] items-center gap-4 lg:grid-cols-[1fr_auto_1fr] lg:gap-8"
  >
    <h1 class="m-0 text-3xl font-light tracking-[-0.04em] sm:text-4xl">Filtros</h1>
  </div>
  <div class="grid grid-cols-1 items-end gap-4 sm:grid-cols-2 lg:grid-cols-[minmax(0,1fr)_minmax(0,1fr)_minmax(0,1fr)_auto]">
    <label class="grid gap-2 text-sm text-neutral-700">
      <span>Buscar por nome</span>
      <app-input
        Icon="search"
        Placeholder=""
        [control]="formFiltrar.controls.nomeCliente"
      ></app-input>
    </label>
    <label class="grid gap-2 text-sm text-neutral-700">
      <span>Buscar por tipo de ensaio</span>
      <app-select
        [control]="formFiltrar.controls.tipoEnsaio"
        Icon="image"
        [Options]="tipoEnsaio"
      ></app-select>
    </label>
    <label class="grid gap-2 text-sm text-neutral-700">
      <span>Buscar por data de publicação</span>
      <app-datetimepicker
        [control]="formFiltrar.controls.dataPublicacao"
        Icon="calendar"
        DateFormat="d/m/Y"
        [Tempo]="false"
      ></app-datetimepicker>
    </label>
    <label class="flex items-end">
      <app-button [FullWidth]="false" (click)="filtrarGalerias()">Filtrar</app-button>
    </label>
  </div>
  <div
    class="mb-6 mt-6 grid grid-cols-[1fr_auto] items-center gap-4 lg:grid-cols-[1fr_auto_1fr] lg:gap-8"
  >
    <h1 class="m-0 text-3xl font-light tracking-[-0.04em] sm:text-4xl">Galerias</h1>
    <p
      class="col-span-2 m-0 text-left text-base text-slate-700 lg:col-span-1 lg:col-start-2 lg:row-start-1 lg:text-center"
    >
      Você tem <strong class="font-medium">{{ galerias.length }}</strong> galerias.
    </p>
  </div>

  <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4">
    <button
      type="button"
      (click)="openClientModal()"
      class="group grid h-36 place-items-center rounded border border-neutral-300 bg-white shadow-sm transition hover:-translate-y-0.5 hover:border-primary hover:shadow-lg hover:shadow-primary/10 sm:h-48"
      aria-label="Criar uma nova galeria"
    >
      <span class="text-6xl font-extralight leading-none text-primary" aria-hidden="true">+</span>
      <span class="sr-only">Criar nova galeria</span>
    </button>

    @for (gallery of galerias; track gallery.guid) {
      <app-galerias [galerias]="gallery" (excluida)="removerGaleria($event)"></app-galerias>
    }

    @if (carregandoGalerias) {
      <p class="col-span-full py-4 text-center text-sm text-neutral-500">Carregando galerias...</p>
    }
  </div>
</section>

<app-modal [Open]="clientModalOpen" (Closed)="closeClientModal()">
  <form class="flex flex-col gap-6 p-6 sm:p-10" (ngSubmit)="salvar()" novalidate>
    <div class="text-center">
      <h2 class="m-0 text-3xl font-light tracking-[-0.04em] text-primary">Cadastrar Cliente</h2>
      <p class="mt-2 text-sm text-neutral-500">Informe os dados do cliente para criar a galeria.</p>
    </div>

    <div class="mx-auto grid w-full max-w-xl gap-5">
      <label class="grid gap-2 text-sm text-neutral-700">
        <span>Nome</span>
        <app-input [control]="clienteForm.controls.nome" Icon="user"></app-input>
        <div
          *ngIf="
            clienteForm.controls.nome.invalid &&
            (clienteForm.controls.nome.dirty || clienteForm.controls.nome.touched)
          "
          class="text-red-500 text-sm mt-1"
        >
          <small *ngIf="clienteForm.controls.nome.errors?.['required']">Nome é obrigatório</small>
        </div>
      </label>

      <label class="grid gap-2 text-sm text-neutral-700">
        <span>E-mail</span>
        <app-input [control]="clienteForm.controls.email" type="email" Icon="at-sign"></app-input>
        <div
          *ngIf="
            clienteForm.controls.email.invalid &&
            (clienteForm.controls.email.dirty || clienteForm.controls.email.touched)
          "
          class="text-red-500 text-sm mt-1"
        >
          <small *ngIf="clienteForm.controls.email.errors?.['required']"
            >E-mail é obrigatório</small
          >
          <small *ngIf="clienteForm.controls.email.errors?.['email']"
            >Informe um e-mail válido</small
          >
        </div>
      </label>

      <label class="grid gap-2 text-sm text-neutral-700">
        <span>Telefone</span>
        <app-input
          [control]="clienteForm.controls.telefone"
          [Telefone]="true"
          Icon="phone"
        ></app-input>
        <div
          *ngIf="
            clienteForm.controls.telefone.invalid &&
            (clienteForm.controls.telefone.dirty || clienteForm.controls.telefone.touched)
          "
          class="mt-1 text-sm text-red-500"
        >
          <small *ngIf="clienteForm.controls.telefone.errors?.['required']"
            >Telefone é obrigatório</small
          >
        </div>
      </label>
      <label class="grid gap-2 text-sm text-neutral-700">
        <span>Tipo de ensaio</span>
        <app-select
          Icon="image"
          [Options]="tipoEnsaio"
          [control]="clienteForm.controls.tipoEnsaio"
        ></app-select>
        <div
          *ngIf="
            clienteForm.controls.tipoEnsaio.invalid &&
            (clienteForm.controls.tipoEnsaio.dirty || clienteForm.controls.tipoEnsaio.touched)
          "
          class="mt-1 text-sm text-red-500"
        >
          <small *ngIf="clienteForm.controls.tipoEnsaio.errors?.['required']"
            >Tipo do ensaio é obrigatório</small
          >
        </div>
      </label>
    </div>

    <div class="flex justify-end gap-3 border-t border-secondary pt-5">
      <button
        type="button"
        (click)="closeClientModal()"
        class="rounded px-4 py-2 text-sm font-medium text-primary hover:bg-secondary"
      >
        Cancelar
      </button>
      <button
        type="submit"
        [disabled]="clienteForm.invalid"
        class="rounded bg-primary px-5 py-2 text-sm font-medium text-[var(--text-primary)] hover:bg-[var(--hover-primary)] disabled:cursor-not-allowed disabled:bg-neutral-200 disabled:text-neutral-400"
      >
        Continuar
      </button>
    </div>
  </form>
</app-modal>
